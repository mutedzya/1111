<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimeCards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<a class="logo" href="#home">ANIME<span>CARDS</span></a>
<nav><a href="#home">Home</a><a href="#characters">Characters</a></nav>
</header>

<section id="home" class="hero">
<div>
<p class="eyebrow">THE ANIME CHARACTER DATABASE</p>
<h1>Discover.<br><i>Collect.</i><br>Remember.</h1>
<p class="lead">A clean character-card collection for anime, games and the characters you never forget.</p>
<a class="button" href="#characters">Browse characters →</a>
</div>
<div class="showcase" id="showcase"></div>
</section>

<section id="characters" class="section">
<div class="heading"><div><p class="eyebrow">DATABASE</p><h2>Characters</h2></div><span id="count"></span></div>
<div class="filters">
<input id="search" placeholder="Search characters...">
<select id="series"><option value="all">All series</option></select>
</div>
<div id="grid" class="grid"></div>
</section>

<div id="modal" class="modal hidden">
<button id="close">×</button>
<div id="modalContent"></div>
</div>

<footer>ANIMECARDS · YOUR CHARACTER DATABASE</footer>
<script src="script.js"></script>
</body>
</html>
